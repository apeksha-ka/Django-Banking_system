<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="/static/css/ui-fallback.css" rel="stylesheet"/>
<title>Sign Up | Obsidian Bank</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0c0c0f",
                        "error-container": "#3b1111",
                        "error": "#ef4444",
                        "on-surface-variant": "#a1a1aa",
                        "secondary-container": "#27272a",
                        "on-tertiary-container": "#bbf7d0",
                        "outline-variant": "#27272a",
                        "surface-container-low": "#0f0f12",
                        "on-primary-container": "#ede9fe",
                        "surface-variant": "#18181b",
                        "surface-container": "#121215",
                        "primary": "#a78bfa",
                        "on-error-container": "#fca5a5",
                        "surface-container-highest": "#1e1e22",
                        "on-tertiary-fixed-variant": "#047857",
                        "on-primary": "#0a0012",
                        "on-surface": "#fafafa",
                        "secondary-fixed-dim": "#71717a",
                        "on-secondary-container": "#a1a1aa",
                        "on-secondary-fixed": "#18181b",
                        "surface-dim": "#0c0c0f",
                        "on-secondary": "#09090b",
                        "on-background": "#fafafa",
                        "inverse-on-surface": "#09090b",
                        "tertiary-fixed": "#bbf7d0",
                        "tertiary-fixed-dim": "#6ee7b7",
                        "inverse-primary": "#5b21b6",
                        "surface-container-lowest": "#09090b",
                        "surface-tint": "#a78bfa",
                        "primary-container": "#7c3aed",
                        "on-primary-fixed": "#2e1065",
                        "on-error": "#1a0000",
                        "secondary": "#71717a",
                        "primary-fixed": "#ede9fe",
                        "tertiary": "#34d399",
                        "surface-container-high": "#18181b",
                        "on-tertiary-fixed": "#003318",
                        "background": "#09090b",
                        "surface-bright": "#18181b",
                        "inverse-surface": "#fafafa",
                        "tertiary-container": "#065f46",
                        "primary-fixed-dim": "#c4b5fd",
                        "outline": "#52525b",
                        "on-secondary-fixed-variant": "#3f3f46",
                        "on-primary-fixed-variant": "#5b21b6",
                        "secondary-fixed": "#a1a1aa",
                        "on-tertiary": "#001a12"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Geist"],
                        "display": ["Geist"],
                        "body": ["Geist"],
                        "label": ["Geist"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Geist', sans-serif;
            background-color: #09090b;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="bg-[#09090b] border-b border-zinc-800 sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-8 py-4 max-w-7xl mx-auto">
<div class="text-xl font-black text-[#fafafa] tracking-tighter uppercase">Apex Bank India</div>
<nav class="hidden md:flex gap-8 items-center">
<a class="font-['Geist'] text-sm tracking-tight text-zinc-400 hover:text-[#fafafa] transition-colors" href="#"><br/></a>
<a class="font-['Geist'] text-sm tracking-tight text-zinc-400 hover:text-[#fafafa] transition-colors" href="#"><br/></a>
<a class="font-['Geist'] text-sm tracking-tight text-zinc-400 hover:text-[#fafafa] transition-colors" href="#"><br/></a>
</nav>
<div class="flex gap-4 items-center">
<button class="bg-primary text-on-primary px-6 py-2 rounded-lg text-sm font-bold active:scale-95 duration-150 transition-all hover:bg-opacity-90" onclick="window.location.href='/login/'" type="button">Login</button>
</div>
</div>
</header>
<!-- Main Content Area (Sign Up Form) -->
<main class="flex-grow flex items-center justify-center px-4 py-12">
<div class="w-full max-w-md">
<!-- Form Card -->
<div class="bg-surface-container border border-outline-variant p-8 rounded-xl shadow-2xl">
<div class="mb-8 text-center">
<h1 class="text-2xl font-bold text-on-surface tracking-tight mb-2">Create an account</h1>
<p class="text-on-surface-variant text-sm">Join Apex Bank India for a secure, developer-grade banking experience.</p>
</div>
{% if error %}
<p class="mb-4 text-sm text-error">{{ error }}</p>
{% endif %}
<form action="/register/" method="post" class="space-y-5">
{% csrf_token %}
<!-- Full Name -->
<div class="space-y-2">
<label class="block text-xs font-medium text-on-surface-variant uppercase tracking-widest">Full Name</label>
<input name="name" class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-secondary" placeholder="John Doe" type="text"/>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block text-xs font-medium text-on-surface-variant uppercase tracking-widest">Email</label>
<input name="email" class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-secondary" placeholder="you@example.com" type="email"/>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="block text-xs font-medium text-on-surface-variant uppercase tracking-widest">Phone Number</label>
<div class="relative">
<input name="phone" class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="+91 9876543210" type="tel"/>
<span class="absolute right-4 top-3 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">call</span>
</span>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-xs font-medium text-on-surface-variant uppercase tracking-widest">Password</label>
<input name="password" class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-secondary" placeholder="Enter password" type="password"/>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<label class="block text-xs font-medium text-on-surface-variant uppercase tracking-widest">Confirm Password</label>
<input class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-secondary" placeholder="Confirm password" type="password"/>
</div>
<!-- Terms Checkbox -->
<!-- Actions -->
<div class="pt-4 space-y-3">
<button class="w-full bg-primary hover:bg-opacity-90 text-on-primary font-bold py-3 rounded-lg transition-all active:scale-[0.98]" type="submit">
                            Create Account
                        </button>
<button class="w-full border border-outline-variant hover:bg-surface-variant text-on-surface font-semibold py-3 rounded-lg transition-all" onclick="window.location.href='/login/'" type="button">
                            Back
                        </button>
</div>
</form>
</div>
<!-- Additional Help Text -->
<p class="mt-8 text-center text-xs text-secondary tracking-wide uppercase">
                Secure 256-bit AES Encryption
            </p>
</div>
</main>
<!-- Footer -->
<footer class="bg-[#09090b] border-t border-zinc-800">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 px-8 py-12 max-w-7xl mx-auto">
<div class="space-y-4">
<div class="text-lg font-bold text-[#fafafa] uppercase">Apex Bank India</div>
<p class="text-zinc-500 font-['Geist'] text-xs uppercase tracking-widest">© 2024 Apex Bank India. Member FDIC. Equal Housing Lender.</p>
</div>
<div class="flex flex-wrap gap-x-6 gap-y-2 md:justify-end items-center">
<a class="font-['Geist'] text-xs uppercase tracking-widest text-zinc-500 hover:text-violet-400 underline transition-all" href="#"><br/></a>
<a class="font-['Geist'] text-xs uppercase tracking-widest text-zinc-500 hover:text-violet-400 underline transition-all" href="#"><br/></a>
<a class="font-['Geist'] text-xs uppercase tracking-widest text-zinc-500 hover:text-violet-400 underline transition-all" href="#"><br/></a>
<a class="font-['Geist'] text-xs uppercase tracking-widest text-zinc-500 hover:text-violet-400 underline transition-all" href="#"><br/></a>
<a class="font-['Geist'] text-xs uppercase tracking-widest text-zinc-500 hover:text-violet-400 underline transition-all" href="#"><br/></a>
</div>
</div>
</footer>
</body></html>
